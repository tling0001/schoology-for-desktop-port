name: Tauri cross-platform builds and releases

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate_ios_certificate:
        description: Generate the iOS distribution certificate and setup artifact only
        required: false
        type: boolean
        default: false
      generate_macos_certificate:
        description: Generate macOS Developer ID Application certificate setup materials only
        required: false
        type: boolean
        default: false
      ios_adhoc_profile_uuid:
        description: Optional exact App Store Connect Ad Hoc profile UUID to use for this iPhone build
        required: false
        type: string
        default: ''
      ios_adhoc_only:
        description: Build only the iOS Ad Hoc package and publish its assets (used by iPhone enrollment)
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ inputs.generate_ios_certificate != true && inputs.generate_macos_certificate != true && inputs.ios_adhoc_only != true }}
    name: Tauri ${{ matrix.platform }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: windows
          - platform: macos
            os: macos-26
            artifact: macos
          - platform: linux
            os: ubuntu-26.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl wget file libxdo-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build the lightweight Tauri Windows updater
        if: matrix.platform == 'windows'
        run: npm run build:updater
      - name: Check macOS signing configuration
        if: matrix.platform == 'macos'
        id: macos_signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$MACOS_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "macOS Developer ID signing/notarization secrets are incomplete; this build will not be Developer ID signed or notarized."
          fi
      - name: Import macOS Developer ID certificate
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Build Tauri packages (Windows/Linux)
        if: matrix.platform != 'macos'
        run: npm run prepare:tauri && npx tauri build
      - name: Sign Windows installer with Authenticode
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host 'Windows signing certificate secrets are not configured. Skipping signing so the Windows build can complete; the resulting installer will be unsigned.'
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'schoology-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'Windows SDK signtool.exe was not found on the runner.' }
            $installers = Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
            if (-not $installers) { throw 'No Windows installer .exe or .msi files were produced.' }
            foreach ($installer in $installers) {
              Write-Host "Signing installer: $($installer.Name)"
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr 'http://timestamp.digicert.com' /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($installer.FullName)." }
              & $signtool.FullName verify /pa /all $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($installer.FullName)." }
              Write-Host "Authenticode signature verified: $($installer.Name)"
            }
          } finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }
      - name: Build macOS package with Developer ID signing
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.ready == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: npm run prepare:tauri && npx tauri build
      - name: Build macOS package without signing
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.ready != 'true'
        shell: bash
        run: |
          npm run prepare:tauri
          env -u APPLE_SIGNING_IDENTITY -u APPLE_ID -u APPLE_PASSWORD -u APPLE_TEAM_ID npx tauri build
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Tauri-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  android:
    if: ${{ inputs.generate_ios_certificate != true && inputs.generate_macos_certificate != true && inputs.ios_adhoc_only != true }}
    name: Tauri Android APK
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973
      - name: Pin the Android NDK for all Rust targets
        shell: bash
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Tauri Android project
        run: npm run prepare:tauri && npx tauri android init
      - name: Prepare Android camera permission and status bar
        run: node scripts/prepare-android-mobile.mjs
      - name: Prepare Schoology launcher icon
        run: node scripts/prepare-android-icon.mjs
      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-android-signing.mjs
      - name: Build signed installable Android APK
        run: npx tauri android build --apk
      - name: Stage Android APK
        id: stage_android_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_ROOT="src-tauri/gen/android/app/build/outputs/apk"
          APK="$(find "$APK_ROOT" -type f -name '*.apk' | grep -E 'universal.*release|release.*universal' | head -n 1 || true)"
          if [ -z "$APK" ]; then APK="$(find "$APK_ROOT" -type f -name '*release*.apk' | head -n 1 || true)"; fi
          test -n "$APK" && test -s "$APK" || { echo "No installable release APK was produced." >&2; find "$APK_ROOT" -type f -print; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER" && test -x "$AAPT" || { echo "Android signing verification tools are missing." >&2; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          PACKAGE_NAME="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE_NAME" = "com.schoologytauri.app" || { echo "Unexpected Android package name: $PACKAGE_NAME" >&2; exit 1; }
          echo "Verified signed Android package: $PACKAGE_NAME"
          echo "Optimized Android APK size:"
          du -h "$APK"
          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-apk
          cp "$APK" "release-apk/Schoology-Android-${VERSION}.apk"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Android-${{ steps.stage_android_apk.outputs.version }}-APK
          path: release-apk/Schoology-Android-*.apk
          if-no-files-found: error
          retention-days: 14

  ios-adhoc:
    if: ${{ inputs.generate_ios_certificate != true && inputs.generate_macos_certificate != true }}
    name: Optional iPhone QR installation package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check Ad Hoc signing configuration
        id: adhoc
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IOS_CERTIFICATE_P12_BASE64" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] && [ -n "$APPSTORE_API_PRIVATE_KEY" ] && [ -n "$APPSTORE_API_KEY_ID" ] && [ -n "$APPSTORE_ISSUER_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Ad Hoc signing secrets are not configured; skipping QR-installable iPhone package."
          fi
      - uses: actions/setup-node@v4
        if: steps.adhoc.outputs.ready == 'true'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.adhoc.outputs.ready == 'true'
        with:
          targets: aarch64-apple-ios
      - name: Install JavaScript dependencies
        if: steps.adhoc.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Download Apple Provisioning Profiles
        if: steps.adhoc.outputs.ready == 'true'
        uses: Apple-Actions/download-provisioning-profiles@v7.0.0
        with:
          bundle-id: com.schoologytauri.app
          profile-type: IOS_APP_ADHOC
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID || vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Import Apple distribution certificate
        if: steps.adhoc.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - name: Select downloaded Ad Hoc provisioning profile
        if: steps.adhoc.outputs.ready == 'true'
        shell: bash
        env:
          REQUESTED_PROFILE_UUID: ${{ inputs.ios_adhoc_profile_uuid }}
        run: |
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$RUNNER_TEMP/adhoc-profile-checks"
          REQUESTED_UUID="${REQUESTED_PROFILE_UUID:-}"
          if [ -n "$REQUESTED_UUID" ] && [[ ! "$REQUESTED_UUID" =~ ^[A-Fa-f0-9-]{36}$ ]]; then echo "The requested provisioning profile UUID is malformed." >&2; exit 1; fi
          SELECTED=""
          for candidate in "$PROFILE_DIR"/*.mobileprovision; do
            [ -f "$candidate" ] || continue
            plist="$RUNNER_TEMP/adhoc-profile-checks/profile.plist"
            security cms -D -i "$candidate" > "$plist" 2>/dev/null || continue
            app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist" 2>/dev/null | sed 's/^[^.]*\.//')"
            devices="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" 2>/dev/null || true)"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist" 2>/dev/null || true)"
            if [ "$app_id" = "com.schoologytauri.app" ] && [ -n "$devices" ] && { [ -z "$REQUESTED_UUID" ] || [ "$uuid" = "$REQUESTED_UUID" ]; }; then SELECTED="$candidate"; break; fi
          done
          test -n "$SELECTED" || { if [ -n "$REQUESTED_UUID" ]; then echo "Requested Ad Hoc profile UUID $REQUESTED_UUID was not downloaded or does not provision registered devices for com.schoologytauri.app." >&2; else echo "No active Ad Hoc profile for com.schoologytauri.app with registered devices was downloaded." >&2; fi; exit 1; }
          cp "$SELECTED" "$RUNNER_TEMP/schoology-adhoc.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/schoology-adhoc.mobileprovision" > "$RUNNER_TEMP/schoology-adhoc-profile.plist"
          echo "Selected Ad Hoc profile UUID: $(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/schoology-adhoc-profile.plist")"
      - name: Generate Schoology iOS app icons
        if: steps.adhoc.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Tauri emits iOS icon PNGs directly under src-tauri/icons/ios; it does not
          # create an Xcode .appiconset Contents.json at this stage.
          npx tauri icon assets/ic_launcher_1024.png
          test -s src-tauri/icons/ios/AppIcon-60x60@3x.png
          test -s src-tauri/icons/ios/AppIcon-512@2x.png
          test -s src-tauri/icons/ios/AppIcon-20x20@1x.png
      - name: Prepare Tauri iOS project
        if: steps.adhoc.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm run prepare:tauri
          npx tauri ios init
          APP_ICON_SET="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          test -s "$APP_ICON_SET/Contents.json" || {
            echo "Generated Xcode project is missing the Schoology AppIcon catalog." >&2
            find src-tauri/gen/apple -iname '*appicon*' -print
            exit 1
          }
          # Explicitly populate the Xcode asset catalog; generated source icons alone are not enough.
          find src-tauri/icons/ios -maxdepth 1 -type f -name '*.png' -size +0c -exec cp -f {} "$APP_ICON_SET/" \;
          test -n "$(find "$APP_ICON_SET" -maxdepth 1 -type f -name '*.png' -size +0c -print -quit)" || {
            echo "Generated iOS AppIcon catalog contains no non-empty PNG images." >&2
            find "$APP_ICON_SET" -maxdepth 1 -type f -print
            exit 1
          }
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset")
          data = json.loads((root / "Contents.json").read_text())
          missing = [item.get("filename") for item in data.get("images", []) if item.get("filename") and not (root / item["filename"]).is_file()]
          if missing:
              print("AppIcon catalog references missing images: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          print(f"Validated {sum(1 for item in data.get('images', []) if item.get('filename'))} iOS AppIcon image references.")
          PY
      - name: Build and export Ad Hoc iPhone IPA
        if: steps.adhoc.outputs.ready == 'true'
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/schoology-adhoc.mobileprovision"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/schoology-adhoc-profile.plist"
          PROFILE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/schoology-adhoc-profile.plist" | sed 's/^[^.]*\.//')"
          test "$PROFILE_BUNDLE_ID" = "com.schoologytauri.app" || { echo "Ad Hoc profile bundle ID must be com.schoologytauri.app, got $PROFILE_BUNDLE_ID" >&2; exit 1; }
          # Tauri must own the iOS build lifecycle: it starts the options server
          # consumed by the generated Xcode Build Rust Code phase. Calling
          # xcodebuild directly leaves cli-options-server.json missing.
          export IOS_MOBILE_PROVISION="$(base64 -i "$PROFILE" | tr -d '\n')"
          npx tauri ios build --ci --export-method release-testing
          IPA="$(find src-tauri/gen/apple -type f -name '*.ipa' -print -quit)"
          test -n "$IPA" && test -s "$IPA" || { echo "Tauri iOS build did not produce an IPA." >&2; find src-tauri/gen/apple -type f -print | tail -n 100; exit 1; }
          VALIDATE_DIR="$RUNNER_TEMP/schoology-adhoc-ipa"
          mkdir -p "$VALIDATE_DIR"
          ditto -x -k "$IPA" "$VALIDATE_DIR"
          EMBEDDED_PROFILE="$(find "$VALIDATE_DIR/Payload" -type f -name 'embedded.mobileprovision' -print -quit)"
          test -n "$EMBEDDED_PROFILE"
          security cms -D -i "$EMBEDDED_PROFILE" > "$RUNNER_TEMP/schoology-embedded-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/schoology-embedded-profile.plist" >/dev/null || { echo "Exported IPA is not Ad Hoc provisioned for registered devices." >&2; exit 1; }
          APP_INFO="$(find "$VALIDATE_DIR/Payload" -maxdepth 2 -type f -name Info.plist -print -quit)"
          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")"
          test "$APP_BUNDLE_ID" = "com.schoologytauri.app" || { echo "Unexpected iOS bundle ID: $APP_BUNDLE_ID" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/Schoology-AdHoc-Export"
          cp "$IPA" "$RUNNER_TEMP/Schoology-AdHoc-Export/Schoology.ipa"
      - name: Create QR installation manifest
        if: steps.adhoc.outputs.ready == 'true'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          IPA="$(find "$RUNNER_TEMP/Schoology-AdHoc-Export" -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p ios-install-assets
          IPA_NAME="Schoology-${VERSION}-iOS-AdHoc.ipa"
          MANIFEST_NAME="Schoology-${VERSION}-iOS-AdHoc.plist"
          QR_NAME="Schoology-${VERSION}-iOS-Install-QR.png"
          cp "$IPA" "ios-install-assets/$IPA_NAME"
          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${IPA_NAME}"
          cat > "ios-install-assets/$MANIFEST_NAME" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>items</key><array><dict>
              <key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>${IPA_URL}</string></dict></array>
              <key>metadata</key><dict><key>bundle-identifier</key><string>com.schoologytauri.app</string><key>bundle-version</key><string>${TAURI_VERSION}</string><key>kind</key><string>software</string><key>title</key><string>Schoology</string></dict>
            </dict></array>
          </dict></plist>
          PLIST
          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${MANIFEST_NAME}"
          ENCODED_MANIFEST_URL="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$MANIFEST_URL")"
          INSTALL_URL="itms-services://?action=download-manifest&url=${ENCODED_MANIFEST_URL}"
          npx --yes qrcode --output "ios-install-assets/$QR_NAME" "$INSTALL_URL"
          cat > ios-install-assets/README.txt <<EOF
          Register the iPhone UDID and include it in the Ad Hoc profile before installing.
          Scan the QR code with the iPhone camera. The release must be public to download the IPA and manifest.
          Apple requires Developer Mode to run apps installed from an IPA. Enable it in Settings > Privacy & Security > Developer Mode, restart, and confirm.
          EOF
      - name: Upload iPhone QR installation assets
        if: steps.adhoc.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-iOS-AdHoc-Install
          path: ios-install-assets/*
          if-no-files-found: error
          retention-days: 14

  ios-certificate:
    name: Generate iOS distribution certificate setup
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_ios_certificate == true }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and register iOS distribution certificate
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: node scripts/generate-ios-distribution-certificate.mjs
      - name: Upload certificate setup materials
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-iOS-Certificate-Setup
          path: ios-certificate-output/*
          if-no-files-found: error
          retention-days: 1

  macos-certificate:
    name: Generate macOS Developer ID certificate setup
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_macos_certificate == true }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate macOS Developer ID certificate setup materials
        env:
          MACOS_CERTIFICATE_PRIVATE_KEY_PEM_BASE64: ${{ secrets.MACOS_CERTIFICATE_PRIVATE_KEY_PEM_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_CER_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_CER_BASE64 }}
        run: node scripts/generate-macos-developer-id-certificate.mjs
      - name: Upload macOS certificate setup materials
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-macOS-Developer-ID-Certificate-Setup
          path: macos-certificate-output/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish versioned Tauri release
    if: always() && github.ref == 'refs/heads/main' && inputs.generate_ios_certificate != true && inputs.generate_macos_certificate != true
    needs: [build, android, ios-adhoc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version-specific release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" RELEASE_NOTES.md release-notes.md <<'PY'
          import re
          import sys
          from pathlib import Path

          version, source, destination = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          sections = re.split(r"(?m)(?=^## \[)", text)
          selected = []
          found_current = False
          def is_immediately_previous_port(candidate, current_version):
              candidate_match = re.match(r"^(.*)-port\.(\d+)$", candidate)
              current_match = re.match(r"^(.*)-port\.(\d+)$", current_version)
              return bool(
                  candidate_match and current_match
                  and candidate_match.group(1) == current_match.group(1)
                  and int(candidate_match.group(2)) == int(current_match.group(2)) - 1
              )
          for section in sections:
              if not section.startswith("## ["):
                  continue
              match = re.match(r"## \[([^\]]+)\]", section)
              if not match:
                  continue
              current = match.group(1) == version
              failed = (
                  bool(re.search(r"(?m)^### Failed build/release attempt\s*$", section))
                  and is_immediately_previous_port(match.group(1), version)
              )
              if current or failed:
                  selected.append(section.strip())
                  found_current = found_current or current
          if not found_current:
              raise SystemExit(f"No release notes found for {version}")
          Path(destination).write_text("\n\n".join(selected) + "\n", encoding="utf-8")
          PY
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Schoology-*
          path: release-assets
          merge-multiple: true
          if-no-artifact-found: ignore
      - name: Prepare release upload files
        shell: bash
        run: |
          mkdir -p release-upload release-assets
          find release-assets -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.apk' -o -name '*.ipa' -o -name '*iOS-AdHoc.plist' -o -name '*iOS-Install-QR.png' -o -name 'README.txt' \) -print0 | while IFS= read -r -d '' file; do cp "$file" "release-upload/$(basename "$file")"; done
          echo "Available release assets:"
          find release-upload -maxdepth 1 -type f -printf '%f\n' | sort || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          name: ${{ steps.release_meta.outputs.version }}
          target_commitish: main
          body_path: release-notes.md
          files: release-upload/*
          overwrite_files: true
          fail_on_unmatched_files: false
          generate_release_notes: false
