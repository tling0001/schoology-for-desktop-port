name: Tauri builds and releases

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Tauri ${{ matrix.platform }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: windows
          - platform: macos
            os: macos-latest
            artifact: macos
          - platform: linux
            os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build Tauri packages
        run: npm run prepare:tauri && npx tauri build
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Tauri-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned Tauri release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version and matching release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk -v v1="## [$VERSION]" -v v2="## [2026.06.0-port.181]" -v v3="## [2026.06.0-port.180]" -v v4="## [2026.06.0-port.179]" '
            /^## \[/ { keep=($0==v1 || $0==v2 || $0==v3 || $0==v4); if (keep) { if (printed++) print ""; print } next }
            keep { print }
          ' RELEASE_NOTES.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No RELEASE_NOTES.md section found for $VERSION" >&2
            exit 1
          fi
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Schoology-Tauri-*
          path: release-assets
          merge-multiple: true
      - name: Prepare release upload files
        shell: bash
        run: |
          mkdir -p release-upload
          find release-assets -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -print0 | while IFS= read -r -d '' file; do cp "$file" "release-upload/$(basename "$file")"; done
          if [ -z "$(find release-upload -maxdepth 1 -type f -print -quit)" ]; then
            echo "No installer packages found to upload." >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          name: ${{ steps.release_meta.outputs.version }}
          target_commitish: main
          body_path: release-notes.md
          files: release-upload/*
          fail_on_unmatched_files: true
          generate_release_notes: false
