name: Build Schoology Releases

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows updater helper
        run: npm run build:updater
      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Windows-Installer-x64
          path: dist/*Setup*.exe
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build macOS DMG
        run: npm run dist:mac
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-macOS
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux DEB + RPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Linux packages
        run: npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Linux-x64
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Schoology-Windows-Installer-x64
          path: release-assets/windows
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: Schoology-macOS
          path: release-assets/macos
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: Schoology-Linux-x64
          path: release-assets/linux
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG="v${PACKAGE_VERSION}"
          gh release create "$TAG" release-assets/windows/* release-assets/macos/* release-assets/linux/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Schoology Desktop $TAG" \
            --generate-notes \
            --latest
