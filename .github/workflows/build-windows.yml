name: Build Schoology Releases

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release from these builds"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Optional release tag (blank = v<run number>)"
        required: false
        default: ""
        type: string
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer + unpacked (no portable build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never
      - name: Build Windows unpacked
        run: npx electron-builder --win dir --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Windows-Installer-x64
          path: dist/*Setup*.exe
          if-no-files-found: error
      - name: Upload Windows unpacked build
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Windows-Unpacked-x64
          path: dist/win-unpacked
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build macOS DMG
        run: npm run dist:mac
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-macOS
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux DEB + RPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Linux packages
        run: npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Linux-x64
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, macos, linux]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Schoology-Windows-Installer-x64
          path: release-assets/windows
      - name: Download Windows unpacked
        uses: actions/download-artifact@v4
        with:
          name: Schoology-Windows-Unpacked-x64
          path: release-assets/windows/unpacked
      - name: Package Windows unpacked build for release
        run: |
          cd release-assets/windows
          zip -r Schoology-Windows-Unpacked-x64.zip unpacked
          rm -rf unpacked
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: Schoology-macOS
          path: release-assets/macos
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: Schoology-Linux-x64
          path: release-assets/linux
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$RUN_NUMBER"
          fi
          gh release create "$TAG" release-assets/windows/* release-assets/macos/* release-assets/linux/*             --repo "$GITHUB_REPOSITORY"             --title "Schoology $TAG"             --generate-notes
