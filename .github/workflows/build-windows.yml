name: Build Schoology for Windows
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer and portable app
        env:
          SCHOOLOGY_CONSUMER_KEY: ${{ secrets.SCHOOLOGY_CONSUMER_KEY }}
          SCHOOLOGY_CONSUMER_SECRET: ${{ secrets.SCHOOLOGY_CONSUMER_SECRET }}
        run: npm run dist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
