name: Build Schoology Windows Port
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable EXE
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SchoologyWindowsPort-Windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error
