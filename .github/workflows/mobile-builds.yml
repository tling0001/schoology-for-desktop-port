name: Tauri Android and iOS builds

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Tauri Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Tauri Android project
        run: npm run prepare:tauri && npx tauri android init
      - name: Build Android APK
        run: npx tauri android build --apk
      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-Android-APK
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Tauri iOS simulator build and optional TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Tauri iOS project
        run: npm run prepare:tauri && npx tauri ios init
      - name: Build iOS simulator app
        run: npx tauri ios build --target aarch64-sim
      - name: Package iOS simulator artifact
        shell: bash
        run: |
          APP="$(find src-tauri/gen/apple -type d -name 'Schoology.app' -path '*iphonesimulator*' -print -quit)"
          if [ -z "$APP" ]; then APP="$(find src-tauri/gen/apple -type d -name '*.app' -print -quit)"; fi
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Schoology-iOS-Simulator.zip"
      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-iOS-Simulator
          path: Schoology-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Check whether TestFlight publishing is configured
        id: signing
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -n "$IOS_CERTIFICATE_P12_BASE64" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] && [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import Apple distribution certificate
        if: steps.signing.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - name: Install App Store provisioning profile
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_TMP="$RUNNER_TEMP/schoology.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_TMP"
          PROFILE_UUID="$(security cms -D -i "$PROFILE_TMP" | plutil -extract UUID raw -o - -)"
          cp "$PROFILE_TMP" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
      - name: Build signed iOS archive for App Store Connect
        if: steps.signing.outputs.ready == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri ios build --target aarch64 --export-method app-store-connect
      - name: Upload IPA to TestFlight
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          IPA="$(find src-tauri/gen/apple -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
