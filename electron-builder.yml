appId: com.schoology.app
productName: Schoology
artifactName: Schoology-${version}-${arch}.${ext}
directories:
  output: dist
files:
  - src/**/*
  - assets/**/*
win:
  target:
    - nsis
    - portable
  icon: assets/ic_launcher.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
