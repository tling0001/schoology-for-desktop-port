[package]
name = "schoology-desktop-port"
version = "2026.6.0"
description = "Schoology Desktop Port native host"
authors = ["Schoology Desktop Port"]
edition = "2021"

[lib]
name = "schoology_desktop_port_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "0bd82c829b31732daedd25ef6674b94dfbe93e46" }
# Use the published, non-yanked compatible rust-ini release used by tauri-plugin-deep-link.
rust-ini = "=0.21.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync"] }
hmac = "0.12"
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
