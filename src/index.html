<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https:; media-src 'self' https: blob:; connect-src 'self' https: http: blob:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schoology</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="bootSplash" class="androidSplash" aria-label="Loading Schoology">
  <img class="androidSplashLogo" src="../assets/android_loading_logo.png" alt="Schoology">
  <img class="androidSplashSpinner" src="../assets/android_loading_spinner_72.gif" alt="">
</div>
<div id="app" style="display:none"></div>
<script>
try {
const app=document.getElementById('app');
const A=window.schoology;
if(!A){ app.innerHTML='<div style="font-family:Arial,sans-serif;padding:32px;color:#22303e;background:#f4f5f5;height:100vh"><h2>Schoology</h2><p>The application interface could not initialize.</p><p>Please restart the app.</p></div>'; throw new Error('Schoology preload bridge is unavailable'); }
const C={graphite:'#44505d',dark:'#22303e',blue:'#2e66a3',blueText:'#3183c8',bg:'#e7ebee',light:'#f4f5f5',white:'#fff',muted:'#868e96'};
let state={screen:'login',school:null,schools:[],q:'',loading:false,error:'',auth:null,user:null,tab:'home'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let h;if(state.screen==='login')h=login();else if(state.screen==='qr')h=qr();else if(state.screen==='school')h=schoolLogin();else h=shell();mount(h);return h}
function mount(h){app.innerHTML=h;bind();}
function login(){return `<div class="login"><img class="logo" src="../assets/logo_schoology.png"><div class="loginBody"><div class="label">School</div><div class="searchWrap"><input id="schoolSearch" autocomplete="off" placeholder="Search for your school" value="${esc(state.q)}"><span>⌕</span></div>${state.schools.length?`<div class="suggestions">${state.schools.map((s,i)=>`<button class="suggestion" data-school="${i}"><b>${esc(s.title)}</b><small>${esc(s.location||s.domain||'')}</small></button>`).join('')}</div>`:''}<button id="continueSchoology" class="primary">Log in using schoology.com</button><div class="or"><span>OR</span></div><button id="schoolLogin" class="secondary">Log in through your School</button><button id="qrLogin" class="linkbtn">Sign in with QR Code</button></div><div class="loginBottom">I need help signing in</div>${state.error?`<div class="error">${esc(state.error)}</div>`:''}</div>`}
function schoolLogin(){return `<div class="login"><button id="back" class="back">‹</button><img class="logo small" src="../assets/logo_schoology.png"><div class="loginBody"><div class="selected">${esc(state.school?.title||'School')}</div><div class="label">Username or Email</div><input id="user" class="field" autocomplete="username"><div class="label">Password</div><input id="pass" class="field" type="password" autocomplete="current-password"><button id="signIn" class="primary">Sign In</button><button id="qrLogin" class="linkbtn">Sign in with QR Code</button></div>${state.error?`<div class="error">${esc(state.error)}</div>`:''}</div>`}
function qr(){return `<div class="qr"><button id="back" class="back">‹</button><h1>QR Code Login</h1><p>Scan Your Code</p><video id="video" autoplay playsinline></video><canvas id="canvas"></canvas><div class="qrbox"></div><p class="qrhint">Point your camera at the QR code shown in Schoology.</p>${state.error?`<div class="error">${esc(state.error)}</div>`:''}</div>`}
function shell(){const tabs=[['home','Home'],['courses','Courses'],['calendar','Calendar'],['grades','Grades'],['messages','Messages'],['notifications','Notifications'],['resources','Resources'],['profile','Profile']];return `<div class="shell"><header><img src="../assets/ic_launcher.png"><span>Schoology</span><button id="logout">Sign out</button></header><nav>${tabs.map(t=>`<button class="tab ${state.tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</nav><main id="content"><div class="loading">Loading…</div></main></div>`}
function bind(){const q=document.getElementById('schoolSearch');if(q){q.oninput=async()=>{state.q=q.value; if(state.q.trim().length<2){state.schools=[];return render()} state.loading=true;try{state.schools=await A.schoolSearch(state.q.trim())}catch(e){state.schools=[]}state.loading=false;render();const nq=document.getElementById('schoolSearch');nq.focus();nq.setSelectionRange(nq.value.length,nq.value.length)}};document.querySelectorAll('[data-school]').forEach(b=>b.onclick=()=>{state.school=state.schools[+b.dataset.school];state.schools=[];state.error='';state.screen='school';render()});const cs=document.getElementById('continueSchoology');if(cs)cs.onclick=()=>{state.error='';if(state.school){state.screen='school';render()}else{state.error='Select your school first.';render()}};const sl=document.getElementById('schoolLogin');if(sl)sl.onclick=()=>{if(!state.school){state.error='Search for and select your school first.';render();return}state.screen='school';render()};const qrbtn=document.getElementById('qrLogin');if(qrbtn)qrbtn.onclick=()=>{state.error='';state.screen='qr';render();startQR()};const back=document.getElementById('back');if(back)back.onclick=()=>{state.screen='login';state.error='';render()};const si=document.getElementById('signIn');if(si)si.onclick=async()=>{const user=document.getElementById('user').value,password=document.getElementById('pass').value;state.error='';si.disabled=true;si.textContent='Logging you in…';try{state.auth=await A.loginCredentials({user,password,schoolId:state.school?.id});await afterLogin()}catch(e){state.error=e.message||'Login failed.';si.disabled=false;si.textContent='Sign In';render()}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();loadTab()});const lo=document.getElementById('logout');if(lo)lo.onclick=async()=>{await A.logout();state.auth=null;state.screen='login';state.tab='home';render()}}
async function afterLogin(){state.screen='app';render();await loadTab()}
async function loadTab(){const c=document.getElementById('content');if(!c)return;c.innerHTML='<div class="loading">Loading…</div>';try{if(state.tab==='home'){const u=await A.api({path:'users/me'});c.innerHTML=`<section class="welcome"><h1>Welcome, ${esc(u.name_display||u.name||'')}</h1><p>Schoology</p></section>`}else if(state.tab==='courses'){const x=await A.api({path:'users/me/sections',params:{limit:100}});const arr=x.section||x.sections||[];c.innerHTML=`<h2>Courses</h2><div class="cards">${arr.map(s=>`<button class="card"><b>${esc(s.section_title||s.title||'Course')}</b><small>${esc(s.course_title||'')}</small></button>`).join('')||'<p>No courses found.</p>'}</div>`}else{c.innerHTML=`<h2>${state.tab[0].toUpperCase()+state.tab.slice(1)}</h2><p>This Schoology module is connected to the Android-compatible API layer.</p>`}}catch(e){c.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function startQR(){const v=document.getElementById('video'),canvas=document.getElementById('canvas');try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});v.srcObject=stream;const ctx=canvas.getContext('2d');const tick=async()=>{if(state.screen!=='qr'){stream.getTracks().forEach(t=>t.stop());return}if(v.readyState>=2){canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0);const img=ctx.getImageData(0,0,canvas.width,canvas.height);const code=window.jsQR?window.jsQR(img.data,img.width,img.height):null;if(code?.data){stream.getTracks().forEach(t=>t.stop());try{state.auth=await A.loginQR(code.data);await afterLogin()}catch(e){state.error=e.message||'QR login failed.';render();startQR();return}}}requestAnimationFrame(tick)};tick()}catch(e){state.error='Camera access is required for QR login. Enable camera permission and try again.';render()}}
// Bootstrap the UI synchronously first. Authentication is checked in the background so
// a stalled IPC call can never prevent the login UI from appearing.
function showApp(){
  const splash=document.getElementById('bootSplash');
  const root=document.getElementById('app');
  if(splash) splash.remove();
  if(root) root.style.display='block';
}
function showLoginNow(){
  state.auth=null;
  state.screen='login';
  render();
  showApp();
}
// Never wait for auth-state before mounting the interface.
render();
setTimeout(()=>showApp(),1000);
(async()=>{
  try {
    const a=await Promise.race([
      A.authState(),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('auth-state timeout')),5000))
    ]);
    state.auth=a;
    if(state.auth){ state.screen='app'; render(); showApp(); loadTab(); }
    else { showLoginNow(); }
  } catch(e) {
    console.warn('Auth state unavailable; showing login:',e);
    showLoginNow();
  }
})();

} catch (e) {
  console.error('Schoology UI startup error:', e);
  document.getElementById('app').innerHTML = '<div style="font-family:Arial,sans-serif;padding:32px;color:#22303e;background:#f4f5f5;height:100vh"><h2>Schoology</h2><p>The application interface failed to start.</p><pre style="white-space:pre-wrap;color:#b1000a">'+String(e && e.stack || e).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre></div>';
}
</script>
</body>
</html>
