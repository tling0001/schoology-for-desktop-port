[package]
name = "schoology-updater-tauri"
version = "1.0.0"
description = "Lightweight Tauri updater for Schoology Desktop Port"
edition = "2021"

[[bin]]
name = "SchoologyUpdater"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sha2 = "0.10"
base64 = "0.22"
